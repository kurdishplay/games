<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یاری تاوڵەی ئۆنلاین</title>
  <style>
    body {
      background-color: #2c1d11;
      color: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .board {
      width: 320px;
      height: 320px;
      margin: 20px auto;
      background-color: #8b5a2b;
      border: 10px solid #4a2f13;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }
    .dice-container { display: flex; gap: 15px; margin-top: 100px; }
    .die {
      width: 50px; height: 50px; background-color: #fff; color: #000;
      font-size: 28px; font-weight: bold; line-height: 50px; border-radius: 8px;
    }
    button {
      background-color: #e67e22; color: white; border: none; padding: 12px 24px;
      font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px;
    }
    button:hover { background-color: #d35400; }
  </style>
</head>
<body>

  <h1>یاری تاوڵەی کوردی</h1>
  <p>کلیک لە دوگمەکە بکە بۆ فڕێدانی زارەکان</p>

  <div class="board">
    <div class="dice-container">
      <div id="dice1" class="die">1</div>
      <div id="dice2" class="die">1</div>
    </div>
    <button onclick="rollDice()">زارەکان فڕێبدە</button>
  </div>

  <script>
    function rollDice() {
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice1').innerText = d1;
      document.getElementById('dice2').innerText = d2;
    }
  </script>

</body>
</html>
