<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Filter</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .snap-btn { background: #FFFC00; color: #000; font-weight: bold; border: none; padding: 15px 30px; font-size: 18px; border-radius: 30px; cursor: pointer; margin-top: 20px; }
    video { width: 90%; max-width: 400px; border-radius: 20px; display: none; border: 3px solid #FFFC00; }
  </style>
</head>
<body>

 <h3 id="title">فلتەری نوێی ئەنیمێ 👻</h3>
  <p id="desc">بۆ بەکارهێنانی فلتەرەکە کلیک بکە و ڕێگەپێدان (Allow) قبووڵ بکە</p>
  
  <video id="webcam" autoplay playsinline></video>
  <button class="snap-btn" id="startBtn" onclick="startCamera()">تاقیکردنەوەی فلتەر</button>
  
  <script>
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('webcam');
        video.srcObject = stream;
        video.style.display = 'block';
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('desc').innerText = 'فلتەرەکە چالاک بوو!';
      } catch (err) {
        alert("تکایە Allow بکە بۆ ئەوەی فلتەرەکە کاربکات.");
      }
    }
  </script>

</body>
</html>
