<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یاری دۆمینەی ئۆنلاین</title>
  <style>
    body { background-color: #0b3c5d; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .domino-table { max-width: 450px; margin: 20px auto; background: #1d2731; padding: 20px; border-radius: 15px; border: 4px solid #328cc1; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
    .hand { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .tile { width: 45px; height: 80px; background: #fbffff; color: #1d2731; border-radius: 6px; border: 2px solid #000; display: flex; flex-direction: column; justify-content: space-around; align-items: center; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .tile-divider { width: 80%; height: 2px; background-color: #000; }
    button { background: #d9b310; color: #1d2731; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    button:hover { background: #e6c200; }
  </style>
</head>
<body>
  <h1>🀄 یاری دۆمینەی کوردی</h1>
  <p>بەردەکانت ڕێکبخە و یاری بکە</p>
  <div class="domino-table">
    <h3>سەنگەری بەردەکانت</h3>
    <div class="hand" id="dominoHand"></div>
    <button onclick="drawNewHand()">ڕێکخستنەوەی بەردەکان 🔄</button>
  </div>
  <script>
    function generateRandomTile() { return { top: Math.floor(Math.random() * 7), bottom: Math.floor(Math.random() * 7) }; }
    function drawNewHand() {
      const handDiv = document.getElementById("dominoHand");
      handDiv.innerHTML = "";
      for (let i = 0; i < 7; i++) {
        const tileData = generateRandomTile();
        const tileEl = document.createElement("div");
        tileEl.className = "tile";
        tileEl.innerHTML = `<span>${tileData.top}</span><div class="tile-divider"></div><span>${tileData.bottom}</span>`;
        handDiv.appendChild(tileEl);
      }
    }
    drawNewHand();
  </script>
</body>
</html>
