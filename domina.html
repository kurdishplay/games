<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یاری دۆمینەی ئۆنلاین</title>
  <style>
    body {
      background-color: #0b3c5d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #1d2731;
      padding: 20px;
      border-radius: 16px;
      border: 3px solid #328cc1;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .board {
      min-height: 120px;
      background: #0f172a;
      border: 2px dashed #328cc1;
      border-radius: 10px;
      margin: 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      overflow-x: auto;
    }

    .hand {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .tile {
      width: 42px;
      height: 75px;
      background: #ffffff;
      color: #1d2731;
      border-radius: 6px;
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      user-select: none;
    }

    .tile:hover {
      transform: translateY(-4px);
      border-color: #2563eb;
    }

    .tile-divider {
      width: 80%;
      height: 2px;
      background-color: #000;
    }

    .btn {
      background: #d9b310;
      color: #1d2731;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover { background: #e6c200; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🀄 یاری دۆمینە</h2>
    <p>کلیک لەسەر هەر بەردێک بکە بۆ داهێنان لەسەر مێزەکە:</p>

    <!-- مێزی یاریەکە -->
    <div class="board" id="gameBoard">
      <span id="emptyMsg" style="color: #94a3b8; font-size: 14px;">مێزەکە چۆڵە، بەردێک دابنێ</span>
    </div>

    <h3>بەردەکانی تۆ</h3>
    <div class="hand" id="playerHand"></div>

    <button class="btn" onclick="resetGame()">تێکدانی بەردەکان 🔄</button>
  </div>

  <script>
    let playerTiles = [];

    function generateHand() {
      playerTiles = [];
      for (let i = 0; i < 7; i++) {
        const top = Math.floor(Math.random() * 7);
        const bottom = Math.floor(Math.random() * 7);
        playerTiles.push({ id: i, top, bottom });
      }
      renderHand();
    }

    function renderHand() {
      const handEl = document.getElementById("playerHand");
      handEl.innerHTML = "";
      
      playerTiles.forEach((tile) => {
        const tileEl = document.createElement("div");
        tileEl.className = "tile";
        tileEl.onclick = () => playTile(tile.id);
        tileEl.innerHTML = `
          <span>${tile.top}</span>
          <div class="tile-divider"></div>
          <span>${tile.bottom}</span>
        `;
        handEl.appendChild(tileEl);
      });
    }

    function playTile(id) {
      const tileIndex = playerTiles.findIndex(t => t.id === id);
      if (tileIndex === -1) return;

      const tile = playerTiles[tileIndex];
      playerTiles.splice(tileIndex, 1);

      const boardEl = document.getElementById("gameBoard");
      const emptyMsg = document.getElementById("emptyMsg");
      if (emptyMsg) emptyMsg.remove();

      const playedTile = document.createElement("div");
      playedTile.className = "tile";
      playedTile.style.cursor = "default";
      playedTile.innerHTML = `
        <span>${tile.top}</span>
        <div class="tile-divider"></div>
        <span>${tile.bottom}</span>
      `;

      boardEl.appendChild(playedTile);
      renderHand();
    }

    function resetGame() {
      document.getElementById("gameBoard").innerHTML = '<span id="emptyMsg" style="color: #94a3b8; font-size: 14px;">مێزەکە چۆڵە، بەردێک دابنێ</span>';
      generateHand();
    }

    // دەستپێکردنی یاری لە کاتی کردنی لاپەڕەکە
    window.onload = generateHand;
  </script>

</body>
</html>
