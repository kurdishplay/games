<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Location</title>
</head>

<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">

  <h2>Simple Location Test</h2>
  <button id="testBtn" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">Get My Location</button>
  
  <p id="out" style="margin-top: 20px; font-weight: bold;"></p>

  <script>
    document.getElementById("testBtn").addEventListener("click", () => {
      const out = document.getElementById("out");
      out.innerHTML = "Requesting...";

      if (!navigator.geolocation) {
        out.innerHTML = "Geolocation is NOT supported by this browser.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          out.innerHTML = `Success! <br> Latitude: ${pos.coords.latitude} <br> Longitude: ${pos.coords.longitude}`;
        },
        (err) => {
          out.innerHTML = `Error (${err.code}): ${err.message}`;
        },
        { enableHighAccuracy: false, timeout: 10000 }
      );
    });
  </script>

</body>
</html>
