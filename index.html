<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Test</title>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">

  <h2>تاقیکردنەوەی شوێن</h2>
  
  <button id="btn" style="padding: 15px 25px; font-size: 18px; cursor: pointer; background: #007aff; color: white; border: none; border-radius: 8px;">
    وەرگرتنی شوێن
  </button>

  <p id="msg" style="margin-top:20px; font-weight:bold;"></p>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      const msg = document.getElementById('msg');
      msg.innerText = "⏳ داواکاری نێردرا...";

      if (!navigator.geolocation) {
        msg.innerText = "❌ Geolocation پشتگیری ناکرێت.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          msg.innerHTML = `✅ سەرکەوتوو بوو!<br>Lat: ${pos.coords.latitude}<br>Lng: ${pos.coords.longitude}`;
        },
        (err) => {
          msg.innerText = "❌ هەڵە: " + err.message + " (کۆد: " + err.code + ")";
        },
        { enableHighAccuracy: false, timeout: 10000 }
      );
    });
  </script>

</body>
</html>
