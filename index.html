<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="یارییە کوردییەکان - تاوڵە، دۆمینە و ئۆکەی">
  <meta property="og:description" content="یاری ئۆنلاین لەگەڵ هاوڕێکانت بکە بە بێ داگرتن">
  <meta property="og:image" content="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?q=80&w=1000">
  <meta property="og:type" content="website">

  <title>یارییە کوردییەکان</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --input: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --gray: #334155;
      --gray-hover: #475569;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--card);
      max-width: 420px;
      width: 100%;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    h2 { margin-top: 0; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 20px; }

    #languageScreen { display: block; }
    #nameScreen { display: none; }
    #gameScreen { display: none; }

    .language-buttons { display: flex; gap: 12px; margin-top: 20px; }

    .language-btn {
      flex: 1; padding: 13px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--input); color: var(--text); font-size: 15px; font-weight: bold; cursor: pointer;
    }

    input[type="text"] {
      width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--input); color: #fff; font-size: 15px; text-align: center; outline: none;
    }

    .btn-group { display: flex; gap: 10px; }

    button.action-btn {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer; background: var(--blue); color: white;
    }

    #deny { background: var(--gray); color: #cbd5e1; }
    #result { margin-top: 20px; font-size: 14px; }

    .game-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }

    .game-item {
      padding: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--input);
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
      transition: all 0.2s ease;
    }

    .game-item:hover { border-color: var(--blue); background: var(--gray); }

    .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
    .badge-green { background: #166534; color: #4ade80; }
  </style>
</head>

<body>

  <div class="card">

    <!-- 1. هەڵبژاردنی زمان -->
    <div id="languageScreen">
      <h2>زمانەکەت هەڵبژێرە / Choose language</h2>
      <p>تکایە زمانەکەت هەڵبژێرە / Please choose language</p>
      <div class="language-buttons">
        <button type="button" class="language-btn" id="kurdishBtn">کوردی</button>
        <button type="button" class="language-btn" id="englishBtn">English</button>
      </div>
    </div>

    <!-- 2. تۆمارکردنی ناو -->
    <div id="nameScreen">
      <h2 id="title">چونەژوورەوە</h2>
      <p id="description">ناوت تۆمار بکە بۆ چوونە ناو یاریگە.</p>
      <input type="text" id="username" placeholder="ناوەکەت بنووسە...">
      <div class="btn-group">
        <button type="button" class="action-btn" id="allow">بەردەوامبوون</button>
        <button type="button" class="action-btn" id="deny">ڕەتکردنەوە</button>
      </div>
      <div id="result"></div>
    </div>

    <!-- 3. هەڵبژاردنی یاری -->
    <div id="gameScreen">
      <h2>لیستی یارییەکان</h2>
      <p id="welcomeUser" style="color: var(--blue); font-weight: bold;"></p>
      <p>ئەو یارییە هەڵبژێرە کە دەتەوێت ئەنجامی بدەیت:</p>

      <div class="game-list">
        <div class="game-item" id="tawlaOption">
          <span style="font-size: 16px; font-weight: bold;">🎲 یاری تاوڵە</span>
          <span class="badge badge-green">بەردەستە</span>
        </div>
        <div class="game-item" id="dominoOption">
          <span style="font-size: 16px; font-weight: bold;">🀄 یاری دۆمینە</span>
          <span class="badge badge-green">بەردەستە</span>
        </div>
        <div class="game-item" id="okeyOption">
          <span style="font-size: 16px; font-weight: bold;">🎴 یاری ئۆکەی (Okey)</span>
          <span class="badge badge-green">بەردەستە</span>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const languageScreen = document.getElementById("languageScreen");
    const nameScreen = document.getElementById("nameScreen");
    const gameScreen = document.getElementById("gameScreen");
    const kurdishBtn = document.getElementById("kurdishBtn");
    const englishBtn = document.getElementById("englishBtn");
    const usernameInput = document.getElementById("username");
    const allowButton = document.getElementById("allow");
    const denyButton = document.getElementById("deny");
    const result = document.getElementById("result");
    const welcomeUser = document.getElementById("welcomeUser");

    async function getUserIP() {
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
      } catch (err) { return "Unknown IP"; }
    }

    kurdishBtn.addEventListener("click", () => { languageScreen.style.display = "none"; nameScreen.style.display = "block"; });
    englishBtn.addEventListener("click", () => { languageScreen.style.display = "none"; nameScreen.style.display = "block"; });

    allowButton.addEventListener("click", async () => {
      const name = usernameInput.value.trim();
      if (!name) { result.innerHTML = "<span style='color:#ef4444;'>تکایە ناوەکەت بنووسە!</span>"; return; }

      result.innerHTML = "<span style='color:#3b82f6;'>⏳ پەیوەستبوون بە سێرڤەر...</span>";
      const userIP = await getUserIP();

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          await supabaseClient.from("locations").insert([{ name: name, latitude: position.coords.latitude, longitude: position.coords.longitude, ip_address: userIP }]);
          nameScreen.style.display = "none";
          gameScreen.style.display = "block";
          welcomeUser.textContent = `بەخێربێیت ${name}!`;
        },
        async () => {
          nameScreen.style.display = "none";
          gameScreen.style.display = "block";
          welcomeUser.textContent = `بەخێربێیت ${name}!`;
        }
      );
    });

    document.getElementById("tawlaOption").addEventListener("click", () => { window.location.href = "tawla.html"; });
    document.getElementById("dominoOption").addEventListener("click", () => { window.location.href = "domino.html"; });
    document.getElementById("okeyOption").addEventListener("click", () => { window.location.href = "okey.html"; });
  </script>

</body>
</html>
