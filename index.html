<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Access</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f9f9f9; }
    .box { max-width: 350px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    input { width: 90%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; }
    button { width: 95%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    #msg { margin-top: 20px; word-break: break-word; }
  </style>
</head>
<body>

  <div class="box">
    <h3>تۆمارکردنی شوێن</h3>
    <input type="text" id="username" placeholder="ناوەکەت بنووسە..." />
    <button id="btn">ناردنی شوێن</button>
    <div id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";
    
    let supabase = null;
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    document.getElementById('btn').addEventListener('click', () => {
      const msg = document.getElementById('msg');
      const name = document.getElementById('username').value;

      if (!name.trim()) {
        msg.innerHTML = "<b style='color:red;'>❌ تکایە پێشتر ناوەکەت بنووسە!</b>";
        return;
      }

      msg.innerText = "⏳ چاوەڕێبە...";

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          msg.innerText = "🔄 داتا دەنێردرێت بۆ Supabase...";

          if (supabase) {
            const { error } = await supabase.from('locations').insert([{
              name: name.trim(),
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude
            }]);

            if (error) {
              msg.innerHTML = "<b style='color:red;'>❌ هەڵەی Supabase: " + error.message + "</b>";
              return;
            }
          }

          msg.innerHTML = "<b style='color:green;'>✅ بە سەرکەوتوویی لە داتابەیس تۆمارکرا!</b>";
        },
        (err) => {
          msg.innerHTML = "<b style='color:red;'>❌ هەڵەی شوێن: " + err.message + "</b>";
        },
        { enableHighAccuracy: false, timeout: 15000 }
      );
    });
  </script>

</body>
</html>
