<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Location Dashboard</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* LOGIN */
    #login {
      max-width: 380px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
    }

    #login h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #007aff;
    }

    button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0066d6;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #error {
      margin-top: 15px;
      text-align: center;
      color: #d00;
      min-height: 20px;
      line-height: 1.5;
    }

    /* DASHBOARD */
    #dashboard {
      display: none;
    }

    #dashboardHeader {
      background: white;
      padding: 15px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      position: relative;
      z-index: 1000;
    }

    #dashboardHeader h2 {
      margin: 0;
      text-align: center;
    }

    #logoutButton {
      max-width: 120px;
      margin: 10px auto 0;
      background: #dc3545;
    }

    #logoutButton:hover {
      background: #bb2d3b;
    }

    #status {
      text-align: center;
      padding: 10px;
      background: #fff;
      color: #555;
    }

    #map {
      height: 80vh;
      width: 100%;
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->
  <div id="login">

    <h2>🔐 Dashboard Login</h2>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="error"></div>

  </div>


  <!-- =========================
       DASHBOARD
  ========================== -->
  <div id="dashboard">

    <div id="dashboardHeader">
      <h2>داشبۆردی بینینی لۆکەیشنەکان</h2>

      <button type="button" id="logoutButton">
چوونەدەر
      </button>
    </div>

    <div id="status">
      لە بارکردن دایە...
    </div>

    <div id="map"></div>

  </div>


  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- =========================
       SUPABASE + APP
  ========================== -->

  <script type="module">

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";


    /* =========================
       SUPABASE CONFIG
    ========================== */

    const SUPABASE_URL =
      "https://mxichdljcrlcomnhkcin.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =========================
       ELEMENTS
    ========================== */

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const errorBox = document.getElementById("error");

    const statusBox = document.getElementById("status");

    const logoutButton =
      document.getElementById("logoutButton");


    /* =========================
       MAP VARIABLE
    ========================== */

    let map = null;


    /* =========================
       SHOW DASHBOARD
    ========================== */

    async function showDashboard() {

      login.style.display = "none";
      dashboard.style.display = "block";

      errorBox.innerText = "";

      await loadLocations();
    }


    /* =========================
       SHOW LOGIN
    ========================== */

    function showLogin() {

      dashboard.style.display = "none";
      login.style.display = "block";

      emailInput.focus();
    }


    /* =========================
       LOGIN
    ========================== */

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      errorBox.style.color = "#555";
      errorBox.innerText = "Logging in...";

      loginButton.disabled = true;
      loginButton.innerText = "Logging in...";


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        errorBox.style.color = "red";
        errorBox.innerText =
          "Please enter your email and password.";

        loginButton.disabled = false;
        loginButton.innerText = "Login";

        return;
      }


      try {

        const {
          data,
          error
        } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });


        if (error) {

          console.error(
            "Supabase login error:",
            error
          );

          errorBox.style.color = "red";

          errorBox.innerText =
            "Login failed: " + error.message;

          loginButton.disabled = false;
          loginButton.innerText = "Login";

          return;
        }


        console.log(
          "Login successful:",
          data
        );


        errorBox.style.color = "green";
        errorBox.innerText =
          "Login successful ✓";


        await showDashboard();


      } catch (err) {

        console.error(
          "Unexpected login error:",
          err
        );

        errorBox.style.color = "red";

        errorBox.innerText =
          "Unexpected error: " +
          (err.message || err);


        loginButton.disabled = false;
        loginButton.innerText = "Login";
      }

    });


    /* =========================
       LOGOUT
    ========================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        await supabase.auth.signOut();

        if (map) {
          map.remove();
          map = null;
        }

        showLogin();

      }
    );


    /* =========================
       LOAD LOCATIONS
    ========================== */

    async function loadLocations() {

      statusBox.innerText =
        "Loading locations...";


      /* Prevent duplicate maps */

      if (map) {

        map.remove();
        map = null;
      }


      /* Create Leaflet map */

      // MAP
map = L.map("map").setView(
  [36.249741, 44.771992],
  10
);


// NORMAL MAP
const normalMap = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
);


// SATELLITE MAP
const satelliteMap = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution:
      "Tiles &copy; Esri"
  }
);


// DEFAULT = NORMAL MAP
normalMap.addTo(map);


// MAP TYPE SWITCHER
const baseMaps = {
  "🗺️ Map": normalMap,
  "🛰️ Satellite": satelliteMap
};


L.control.layers(
  baseMaps,
  null,
  {
    position: "topright",
    collapsed: false
  }
).addTo(map);

      /* =========================
         GET LOCATIONS
      ========================== */

      const {
        data,
        error
      } = await supabase
        .from("locations")
        .select(
          "latitude, longitude, name, created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(
          "Location loading error:",
          error
        );

        statusBox.style.color = "red";

        statusBox.innerText =
          "Could not load locations: " +
          error.message;

        return;
      }


      if (!data || data.length === 0) {

        statusBox.style.color = "#555";

        statusBox.innerText =
          "No locations found.";

        return;
      }


      /* =========================
         ADD MARKERS
      ========================== */

      const bounds = [];


      data.forEach(function(location) {

        if (
          location.latitude == null ||
          location.longitude == null
        ) {
          return;
        }


        const latitude =
          Number(location.latitude);

        const longitude =
          Number(location.longitude);


        if (
          Number.isNaN(latitude) ||
          Number.isNaN(longitude)
        ) {
          return;
        }


        const marker =
          L.marker([
            latitude,
            longitude
          ]).addTo(map);


        const name =
          location.name || "Unknown";


        const createdAt =
          location.created_at
            ? new Date(
                location.created_at
              ).toLocaleString()
            : "";


        marker.bindPopup(`
          <div style="min-width:150px;">
            <strong>📍 ${escapeHtml(name)}</strong>
            ${
              createdAt
                ? `<br><small>${escapeHtml(createdAt)}</small>`
                : ""
            }
          </div>
        `);


        bounds.push([
          latitude,
          longitude
        ]);

      });


      /* =========================
         FIT MAP TO MARKERS
      ========================== */

      if (bounds.length > 0) {

        map.fitBounds(bounds, {
          padding: [30, 30]
        });

      }


      statusBox.style.color = "green";

      statusBox.innerText =
        `${bounds.length} location(s) found.`;

    }


    /* =========================
       HTML ESCAPE
    ========================== */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================
       CHECK EXISTING SESSION
    ========================== */

    async function checkSession() {

      try {

        const {
          data,
          error
        } = await supabase.auth.getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

          return;
        }


        if (data.session) {

          console.log(
            "Existing session found."
          );

          await showDashboard();

        } else {

          console.log(
            "No active session."
          );

          showLogin();

        }

      } catch (err) {

        console.error(
          "Session check failed:",
          err
        );

        showLogin();
      }

    }


    /* =========================
       AUTH STATE LISTENER
    ========================== */

    supabase.auth.onAuthStateChange(
      async function(event, session) {

        console.log(
          "Auth event:",
          event
        );

        if (
          event === "SIGNED_IN" &&
          session
        ) {

          await showDashboard();

        }

        if (
          event === "SIGNED_OUT"
        ) {

          if (map) {

            map.remove();
            map = null;
          }

          showLogin();
        }

      }
    );


    /* =========================
       START APP
    ========================== */

    checkSession();

  </script>

</body>
</html>
```
