<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Location Dashboard</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    #login {
      max-width: 350px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 95%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #dashboard {
      display: none;
    }

    h2 {
      text-align: center;
      padding: 15px;
    }

    #map {
      height: 80vh;
      width: 100%;
    }

    #error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login">

    <h2>🔐 Dashboard Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div id="error"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <h2>📍 My Location Dashboard</h2>

    <div id="map"></div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://mxichdljcrlcomnhkcin.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // LOGIN
    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const errorBox =
        document.getElementById("error");

      errorBox.innerText = "Logging in...";


      const { data, error } =
        await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        errorBox.innerText =
          "Login failed: " + error.message;

        return;
      }


      // Hide login
      document.getElementById("login").style.display = "none";

      // Show dashboard
      document.getElementById("dashboard").style.display = "block";


      loadLocations();
    }



    // LOAD LOCATIONS
    async function loadLocations() {

      const map =
        L.map("map").setView(
          [36.249741, 44.771992],
          10
        );


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution:
            "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);


      const { data, error } =
        await supabase
          .from("locations")
          .select("latitude, longitude, name, created_at");


      if (error) {

        console.error(error);

        alert(
          "Could not load locations: " +
          error.message
        );

        return;
      }


      data.forEach(location => {

        if (
          location.latitude == null ||
          location.longitude == null
        ) {
          return;
        }


        const marker =
          L.marker([
            location.latitude,
            location.longitude
          ]).addTo(map);


        marker.bindPopup(
          "📍 " +
          (location.name || "Unknown")
        );

      });

    }

  </script>

</body>
</html>
