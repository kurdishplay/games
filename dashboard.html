<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Dashboard Pro</title>

  <!-- Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" 
    integrity="sha512-h9A8XyX9r38b8yB+9/0sX1C3P8B9/21uE2pQ+m9K6B8/x5C1b9y2V8y21/11uE1A2B==" 
    crossorigin="" 
  />

  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* LOGIN CONTAINER */
    #login {
      max-width: 400px;
      margin: 100px auto;
      background: var(--card-bg);
      padding: 35px 30px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    #login h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #0f172a;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #error {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    /* MAIN DASHBOARD LAYOUT */
    #dashboard {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    #dashboardHeader {
      background: var(--card-bg);
      padding: 14px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    #dashboardHeader h2 {
      font-size: 18px;
      font-weight: 600;
    }

    #logoutButton {
      width: auto;
      padding: 8px 16px;
      background: var(--danger);
      font-size: 14px;
    }

    #logoutButton:hover {
      background: #dc2626;
    }

    /* DASHBOARD CONTENT GRID */
    .dashboard-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
      position: relative;
    }

    .sidebar {
      width: 320px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 999;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header input {
      margin-bottom: 0;
    }

    .location-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .location-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .location-card:hover {
      border-color: var(--accent);
    }

    .location-card h4 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .location-card p {
      font-size: 12px;
      color: var(--text-sub);
    }

    #status {
      padding: 10px;
      font-size: 13px;
      text-align: center;
      color: var(--text-sub);
      border-top: 1px solid var(--border-color);
    }

    /* MAP FIXED DIMENSIONS */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 400px;
      background: #0f172a;
    }

    @media (max-width: 768px) {
      .dashboard-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 250px;
      }
    }
  </style>
</head>
<body>

  <!-- LOGIN MODULE -->
  <div id="login">
    <h2>🔐 Dashboard Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" autocomplete="email" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="loginButton">Sign In</button>
    </form>
    <div id="error"></div>
  </div>

  <!-- DASHBOARD MODULE -->
  <div id="dashboard">
    <div id="dashboardHeader">
      <h2>📍 Geospatial Location Tracker</h2>
      <button type="button" id="logoutButton">Logout</button>
    </div>

    <div class="dashboard-container">
      <div class="sidebar">
        <div class="sidebar-header">
          <input type="text" id="searchInput" placeholder="Search locations...">
        </div>
        <div class="location-list" id="locationList">
          <!-- Dynamically Populated -->
        </div>
        <div id="status">Loading data...</div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" 
    integrity="sha512-puJW3E/qZD3pXyGE32HP74teMQj5QDgBoEa5S7vV8cscUIkLKYvhL3aMvwFzpC1fJi515v25Z/151755171==" 
    crossorigin="">
  </script>

  <!-- SUPABASE & APP LOGIC -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://mxichdljcrlcomnhkcin.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SlntFaOIzECUYXOwVUzmDQ_cLzgxh-P";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Elements
    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("error");
    const statusBox = document.getElementById("status");
    const logoutButton = document.getElementById("logoutButton");
    const locationList = document.getElementById("locationList");
    const searchInput = document.getElementById("searchInput");

    let map = null;
    let markersList = [];
    let locationsData = [];

    async function showDashboard() {
      login.style.display = "none";
      dashboard.style.display = "flex";
      errorBox.innerText = "";
      
      await loadLocations();

      // Recalculate Leaflet tile layout after changing display to flex
      setTimeout(() => {
        if (map) {
          map.invalidateSize();
        }
      }, 200);
    }

    function showLogin() {
      dashboard.style.display = "none";
      login.style.display = "block";
      emailInput.focus();
    }

    // LOGIN HANDLER
    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      errorBox.style.color = "var(--text-sub)";
      errorBox.innerText = "Authenticating...";
      loginButton.disabled = true;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      if (error) {
        errorBox.style.color = "var(--danger)";
        errorBox.innerText = "Authentication failed: " + error.message;
        loginButton.disabled = false;
        return;
      }

      await showDashboard();
    });

    // LOGOUT HANDLER
    logoutButton.addEventListener("click", async () => {
      await supabase.auth.signOut();
      if (map) {
        map.remove();
        map = null;
      }
      showLogin();
    });

    // LOAD MAP AND DATA
    async function loadLocations() {
      statusBox.innerText = "Fetching locations...";
      locationList.innerHTML = "";

      if (map) {
        map.remove();
        map = null;
      }

      // Initialize Leaflet Map
      map = L.map("map").setView([36.249741, 44.771992], 10);

      // OpenStreetMap Normal Tile Layer
      const normalMap = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }
      );

      // Satellite Tile Layer (Esri)
      const satelliteClarity = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 19,
          attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }
      );

      // Add default tile layer
      normalMap.addTo(map);

      // Add Layer Control Switcher
      L.control.layers({
        "🗺️ Standard Map": normalMap,
        "🛰️ High-Res Satellite": satelliteClarity
      }, null, { position: "topright" }).addTo(map);

      // FETCH DATA FROM SUPABASE
      const { data, error } = await supabase
        .from("locations")
        .select("latitude, longitude, name, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        statusBox.style.color = "var(--danger)";
        statusBox.innerText = "Error loading locations: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        statusBox.innerText = "No locations found in database.";
        return;
      }

      locationsData = data;
      renderLocations(locationsData);
    }

    function renderLocations(items) {
      // Clear previous markers
      markersList.forEach(m => map.removeLayer(m));
      markersList = [];
      locationList.innerHTML = "";

      const bounds = [];

      items.forEach((loc) => {
        const lat = Number(loc.latitude);
        const lng = Number(loc.longitude);

        if (isNaN(lat) || isNaN(lng)) return;

        const name = loc.name || "Anonymous User";
        const dateStr = loc.created_at ? new Date(loc.created_at).toLocaleString() : "";

        // Add Marker to Leaflet Map
        const marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`
          <div style="color: #000; font-family: sans-serif;">
            <strong>📍 ${escapeHtml(name)}</strong><br>
            <small>${escapeHtml(dateStr)}</small>
          </div>
        `);

        markersList.push(marker);
        bounds.push([lat, lng]);

        // Add Sidebar Item
        const card = document.createElement("div");
        card.className = "location-card";
        card.innerHTML = `
          <h4>${escapeHtml(name)}</h4>
          <p>${escapeHtml(dateStr)}</p>
        `;
        card.onclick = () => {
          map.setView([lat, lng], 16);
          marker.openPopup();
        };

        locationList.appendChild(card);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }

      statusBox.style.color = "var(--accent)";
      statusBox.innerText = `Showing ${items.length} logged locations`;
    }

    // SEARCH FILTER
    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = locationsData.filter(item => 
        (item.name && item.name.toLowerCase().includes(query))
      );
      renderLocations(filtered);
    });

    function escapeHtml(val) {
      return String(val)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    // AUTH SESSION CHECK
    async function checkSession() {
      const { data } = await supabase.auth.getSession();
      if (data?.session) {
        await showDashboard();
      } else {
        showLogin();
      }
    }

    checkSession();
  </script>
</body>
</html>
